<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bland2Glam Links</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --fg:#111111; --muted:#555555; --ring:#D8141C;
  --card:#FFFFFF; --cardfg:#111111; --border:#111111;
  --pbg:#D8141C; --pfg:#FFFFFF;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111111; --fg:#FFFFFF; --muted:#CFCFCF; --ring:#FF3B3B;
    --card:#1C1C1C; --cardfg:#FFFFFF; --border:#D8141C;
    --pbg:#D8141C; --pfg:#FFFFFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111111; --fg:#FFFFFF; --muted:#CFCFCF; --ring:#FF3B3B;
  --card:#1C1C1C; --cardfg:#FFFFFF; --border:#D8141C;
  --pbg:#D8141C; --pfg:#FFFFFF;
  color-scheme:dark;
}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:460px;margin:0 auto;padding-block:40px 32px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;text-align:center}
.mark{width:96px;height:96px;border-radius:50%;border:3px solid var(--ring);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:34px;color:var(--fg);letter-spacing:1px}
h1{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:40px;line-height:1.1;margin:20px 0 6px;color:var(--fg);text-wrap:balance}
.sub{margin:0;font-size:16px;color:var(--muted)}
.tag{margin:14px 0 28px;font-size:15px;color:var(--fg);max-width:34ch;line-height:1.45}
.links{width:100%;display:flex;flex-direction:column;gap:12px;padding:0;margin:0;list-style:none}
.links a{display:flex;align-items:center;gap:14px;min-height:56px;padding:12px 18px;border-radius:14px;border:1.5px solid var(--border);background:var(--card);color:var(--cardfg);text-decoration:none;font-size:17px;font-weight:700;text-align:left;transition:transform .12s ease,box-shadow .12s ease;box-sizing:border-box}
.links a:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.links a:active{transform:translateY(0)}
.links a:focus-visible{outline:3px solid var(--ring);outline-offset:3px}
.links a.primary{background:var(--pbg);color:var(--pfg);border-color:var(--pbg)}
.links svg{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h2{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin:26px 0 12px;font-weight:700}
footer{margin-top:30px;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.links a{transition:none}}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">B2G</div>
  <h1>Bland2Glam</h1>
  <p class="sub">Urban jewellery for men and women</p>
  <p class="tag">One piece takes any fit from bland to glam.</p>

  <ul class="links">
    <li><a class="primary" href="https://bland2glam.com.ng/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      <span>Shop our website</span></a></li>
    <li><a class="primary" href="https://wa.me/2348127383393?text=Hi%20Bland2Glam" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.4-4.2A8 8 0 1 1 8.4 18.7L4 20z"/><path d="M9.5 9.5c.4 2.2 2.8 4.6 5 5l1.2-1.2-1.8-1-.8.6c-.8-.3-1.7-1.2-2-2l.6-.8-1-1.8-1.2 1.2z"/></svg>
      <span>Chat with us on WhatsApp</span></a></li>
  </ul>

  <h2>Follow us</h2>
  <ul class="links">
    <li><a href="https://www.instagram.com/bland2glam" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".8"/></svg>
      <span>Instagram</span></a></li>
    <li><a href="https://www.facebook.com/share/1EBmpTXTMi/" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M15 20.5v-6.5h2.2l.4-2.6H15V9.8c0-.8.3-1.3 1.4-1.3h1.3V6.2c-.3 0-1.1-.1-2-.1-2 0-3.3 1.2-3.3 3.4v1.9H10.2V14h2.2v6.5"/></svg>
      <span>Facebook</span></a></li>
    <li><a href="https://x.com/Bland2Glam" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
      <span>X (Twitter)</span></a></li>
  </ul>

  <h2>Visit us</h2>
  <ul class="links">
    <li><a href="https://bland2glam.com.ng/store-location/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>
      <span>Find a store</span></a></li>
  </ul>

  <footer>&copy; Bland2Glam</footer>
</main>
</body>
</html>
